<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#0c2a4d"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e3a5f" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Floating envelope icon, left -->
  <g transform="translate(125, 220)" filter="url(#glow)">
    <rect x="0" y="0" width="220" height="160" rx="12" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <path d="M 6 6 L 110 95 L 214 6" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="220" cy="8" r="22" fill="#22d3ee"/>
    <text x="220" y="16" font-family="Arial, sans-serif" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">@</text>
  </g>

  <!-- Main title -->
  <text x="430" y="240" font-family="'WenQuanYi Zen Hei', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" fill="#f1f5f9" font-weight="700">邮件营销完整指南</text>
  <text x="430" y="310" font-family="'WenQuanYi Zen Hei', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" fill="#f1f5f9" font-weight="700">2026</text>

  <!-- Accent divider -->
  <rect x="430" y="338" width="90" height="4" fill="url(#accent)" rx="2"/>

  <!-- Subtitle -->
  <text x="430" y="388" font-family="'WenQuanYi Zen Hei', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#94a3b8" font-weight="400">从入门到精通 · 一般读者可用的系统指南</text>

  <!-- Stats row -->
  <g transform="translate(430, 440)">
    <text font-family="-apple-system, sans-serif" font-size="34" fill="#38bdf8" font-weight="700">36:1</text>
    <text y="32" font-family="'WenQuanYi Zen Hei', 'PingFang SC', sans-serif" font-size="15" fill="#cbd5e1">平均 ROI</text>

    <text x="180" font-family="'WenQuanYi Zen Hei', sans-serif" font-size="34" fill="#38bdf8" font-weight="700">44亿</text>
    <text x="180" y="32" font-family="'WenQuanYi Zen Hei', 'PingFang SC', sans-serif" font-size="15" fill="#cbd5e1">全球用户</text>

    <text x="360" font-family="-apple-system, sans-serif" font-size="34" fill="#38bdf8" font-weight="700">99%</text>
    <text x="360" y="32" font-family="'WenQuanYi Zen Hei', 'PingFang SC', sans-serif" font-size="15" fill="#cbd5e1">日活邮箱</text>
  </g>

  <!-- Author chip -->
  <g transform="translate(430, 540)">
    <rect width="210" height="42" rx="21" fill="#0c2a4d" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="8" fill="#38bdf8"/>
    <text x="42" y="27" font-family="'WenQuanYi Zen Hei', 'PingFang SC', sans-serif" font-size="16" fill="#e2e8f0">Snov.io 中国团队</text>
  </g>
</svg>
