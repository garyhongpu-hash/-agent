<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhatsApp 聊天截图生成器</title>
<style>
  :root {
    --wa-green: #008069;
    --wa-light: #efeae2;
    --wa-bubble: #d9fdd3;
    --text: #111b21;
    --muted: #667781;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f7f9;
    color: var(--text);
  }
  header {
    background: var(--wa-green);
    color: #fff;
    padding: 16px 24px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  main {
    max-width: 960px;
    margin: 24px auto;
    padding: 0 16px;
    display: grid;
    gap: 20px;
    grid-template-columns: 1fr 1fr;
  }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  textarea, input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  textarea { min-height: 240px; resize: vertical; }
  .row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 10px; }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  button {
    background: var(--wa-green);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  button.secondary {
    background: #fff;
    color: var(--wa-green);
    border: 1px solid var(--wa-green);
  }
  #preview {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: #f0ece5;
    border-radius: 8px;
    padding: 12px;
    min-height: 240px;
  }
  #preview img { max-width: 100%; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  #preview .placeholder { color: var(--muted); font-size: 14px; }
  #error { color: #b42318; font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>WhatsApp 聊天截图生成器</h1>
  <p>粘贴任意包含对话的文字，AI 自动识别对话并生成 WhatsApp 风格截图</p>
</header>
<main>
  <section class="panel">
    <h2>输入文字</h2>
    <label for="text">聊天对话 / 任意混合文字</label>
    <textarea id="text" placeholder="示例：
今天跟客户聊了一下，他很关心价格。
客户：你好，报价多少？
我：您好，FOB 上海 USD 12/pc。
客户：可以做 10 美元吗？
我：量大可以谈。"></textarea>
    <div class="row">
      <div>
        <label for="contact">联系人名称（可选，留空由 AI 推断）</label>
        <input id="contact" type="text" placeholder="例如：John Smith" />
      </div>
      <div>
        <label for="width">图片宽度（像素）</label>
        <input id="width" type="number" value="420" min="320" max="1080" />
      </div>
    </div>
    <div class="row">
      <div>
        <label for="phone">手机外壳样式</label>
        <select id="phone">
          <option value="iphone">iPhone（Dynamic Island）</option>
          <option value="android">Android（挖孔屏）</option>
          <option value="none">无外壳（仅聊天区域）</option>
        </select>
      </div>
      <div></div>
    </div>
    <div class="actions">
      <button id="generate">生成截图</button>
      <button id="download" class="secondary" disabled>下载 PNG</button>
    </div>
    <div id="error"></div>
    <p class="hint">服务端用 Claude 识别对话并用 Pillow 渲染为亮色主题截图。</p>
  </section>
  <section class="panel">
    <h2>预览</h2>
    <div id="preview"><div class="placeholder">生成后截图将在此显示</div></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let currentBlobUrl = null;

async function generate() {
  const text = $("text").value.trim();
  const contact = $("contact").value.trim();
  const width = parseInt($("width").value, 10) || 420;
  const phone_style = $("phone").value;
  $("error").textContent = "";
  if (!text) {
    $("error").textContent = "请输入文字内容";
    return;
  }
  const btn = $("generate");
  btn.disabled = true;
  btn.textContent = "生成中...";
  try {
    const resp = await fetch("/api/v1/whatsapp/screenshot", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text,
        contact_name: contact || null,
        width,
        phone_style,
      }),
    });
    if (!resp.ok) {
      let detail = resp.statusText;
      try {
        const j = await resp.json();
        detail = j.detail || detail;
      } catch (_) {}
      throw new Error(`生成失败 (HTTP ${resp.status})：${detail}`);
    }
    const blob = await resp.blob();
    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = URL.createObjectURL(blob);
    const preview = $("preview");
    preview.innerHTML = "";
    const img = document.createElement("img");
    img.src = currentBlobUrl;
    img.alt = "WhatsApp 截图";
    preview.appendChild(img);
    $("download").disabled = false;
  } catch (e) {
    $("error").textContent = e.message || String(e);
  } finally {
    btn.disabled = false;
    btn.textContent = "生成截图";
  }
}

function download() {
  if (!currentBlobUrl) return;
  const a = document.createElement("a");
  a.href = currentBlobUrl;
  a.download = "whatsapp-chat.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

$("generate").addEventListener("click", generate);
$("download").addEventListener("click", download);
</script>
</body>
</html>
