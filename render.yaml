services:
  - type: web
    name: whatsapp-screenshot
    runtime: docker
    plan: free
    region: singapore
    branch: claude/whatsapp-screenshot-generator-AocQ4
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: claude-sonnet-4-6
